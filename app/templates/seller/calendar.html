{% extends "seller/base.html" %}
{% load static %}

{% block content %}
      <!-- =========================================================
           PAGE: CALENDAR
      ========================================================== -->
      <section id="page-calendar" class="page active space-y-6">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-extrabold text-ink-900 dark:text-white">Calendar</h2>
            <p class="text-sm text-ink-400">July 2026</p>
          </div>
          <div class="flex items-center gap-2">
            <button class="h-9 w-9 grid place-items-center rounded-xl border border-ink-200 dark:border-ink-700 text-ink-500 hover:bg-ink-100 dark:hover:bg-ink-800"><i class="ri-arrow-left-s-line"></i></button>
            <button class="h-9 w-9 grid place-items-center rounded-xl border border-ink-200 dark:border-ink-700 text-ink-500 hover:bg-ink-100 dark:hover:bg-ink-800"><i class="ri-arrow-right-s-line"></i></button>
          </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
          <!-- Calendar grid -->
          <div class="lg:col-span-3 card p-4 sm:p-6">
            <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2">
              <div class="cal-head">Sun</div><div class="cal-head">Mon</div><div class="cal-head">Tue</div>
              <div class="cal-head">Wed</div><div class="cal-head">Thu</div><div class="cal-head">Fri</div><div class="cal-head">Sat</div>
            </div>
            <div id="cal-grid" class="grid grid-cols-7 gap-1 sm:gap-2"></div>
          </div>
          <!-- Legend / upcoming -->
          <div class="card p-6">
            <h3 class="font-bold text-ink-900 dark:text-white mb-4">Event Types</h3>
            <div class="space-y-3">
              <div class="flex items-center gap-2"><span class="h-3 w-3 rounded bg-brand-500"></span><span class="text-sm text-ink-600 dark:text-ink-300">Scheduled Visit</span></div>
              <div class="flex items-center gap-2"><span class="h-3 w-3 rounded bg-warning-500"></span><span class="text-sm text-ink-600 dark:text-ink-300">Inspection</span></div>
              <div class="flex items-center gap-2"><span class="h-3 w-3 rounded bg-success-500"></span><span class="text-sm text-ink-600 dark:text-ink-300">Rent Meeting</span></div>
              <div class="flex items-center gap-2"><span class="h-3 w-3 rounded bg-danger-500"></span><span class="text-sm text-ink-600 dark:text-ink-300">Closing Date</span></div>
            </div>
            <hr class="my-5 border-ink-200 dark:border-ink-800" />
            <h3 class="font-bold text-ink-900 dark:text-white mb-3">Today</h3>
            <div id="cal-today" class="space-y-2"></div>
          </div>
        </div>
      </section>
{% endblock %}

{% block extra_js %}
<script>
  window.REAL_CALENDAR_EVENTS = {{ calendar_events_json|default:'[]'|safe }};
</script>
<script src="{% static 'seller/js/calendar.js' %}"></script>
{% endblock %}
